spring.application.name=webonix-tap-backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webonix_tap?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local development only; production overrides cookie and schema settings.
server.address=127.0.0.1
server.forward-headers-strategy=none
app.cookies.secure=false
spring.jpa.open-in-view=false
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=16KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Password recovery: explicitly enable after configuring SMTP credentials.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.sender-name=${MAIL_SENDER_NAME:Webonix Tap}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
